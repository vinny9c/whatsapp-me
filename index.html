<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question for You...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
            padding: 20px;
            position: relative;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 45px 35px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(255, 71, 126, 0.15), 0 5px 15px rgba(0, 0, 0, 0.05);
            max-width: 440px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            z-index: 10;
            animation: cardAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        h1 {
            color: #ff477e;
            font-size: 2.2rem;
            margin-bottom: 35px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            height: 60px;
            align-items: center;
        }

        button, .wa-link {
            padding: 14px 40px;
            font-size: 1.15rem;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
        }

        #yes-btn {
            background: linear-gradient(135deg, #ff477e 0%, #ff7096 100%);
            color: white;
            box-shadow: 0 6px 20px rgba(255, 71, 126, 0.4);
            animation: heartbeat 1.5s infinite;
        }

        #yes-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 71, 126, 0.5);
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.08); }
            28% { transform: scale(1); }
            42% { transform: scale(1.08); }
            70% { transform: scale(1); }
        }

        #no-btn {
            background-color: #f1f3f5;
            color: #495057;
            border: 1px solid #dee2e6;
            z-index: 999;
        }

        .wa-link {
            background: linear-gradient(135deg, #25D366 0%, #1ebd58 100%);
            color: white;
            margin-top: 20px;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.3);
        }

        .wa-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
        }

        .success-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .success-text {
            font-size: 2rem;
            color: #ff477e;
            font-weight: 800;
        }

        .photo-wrapper {
            position: relative;
            margin-top: 10px;
        }

        .photo-frame {
            width: 100%;
            max-width: 260px;
            height: auto;
            border-radius: 20px;
            border: 6px solid #ffffff;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .heart-particle {
            position: absolute;
            color: #ff7096;
            font-size: 1.5rem;
            pointer-events: none;
            z-index: 1;
            animation: floatUp 4s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card" id="quiz-card">
        <h1>Do you miss me?</h1>
        <div class="btn-container">
            <button id="yes-btn">Yes</button>
            <button id="no-btn">No</button>
        </div>
    </div>

    <div class="card" id="success-card" style="display: none; max-width: 500px;">
        <div class="success-content">
            <div>
                <div class="success-text">I miss you too! ❤️</div>
                <a href="whatsapp://send?phone=254745169071&text=I%20clicked%20yes!%20I%20miss%20you%20too%20%E2%9D%A4%EF%B8%8F" class="wa-link">Tell me on WhatsApp</a>
            </div>
            <div class="photo-wrapper">
                <img src="vin2.jpg" alt="My Photo" class="photo-frame">
            </div>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const quizCard = document.getElementById('quiz-card');
        const successCard = document.getElementById('success-card');

        function moveNoButton() {
            const padding = 40;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            moveNoButton();
        });

        function createFloatingHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            heart.style.fontSize = (Math.random() * 1 + 1) + 'rem';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }

        yesBtn.addEventListener('click', function() {
            quizCard.style.display = 'none';
            successCard.style.display = 'block';
            setInterval(createFloatingHeart, 300);
        });
    </script>
</body>
</html>
